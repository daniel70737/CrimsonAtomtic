[package]
name = "cd-copy-save"
version = "0.1.0"
edition = "2021"
description = "Minimal offline Crimson Desert copy-save CLI: inventory export, no-op roundtrip, optional add-one-item on a COPY."
publish = false

[[bin]]
name = "cd-copy-save"
path = "src/main.rs"

[dependencies]
# Path dep on the locally cloned vendor. vendor/crimson-rs is gitignored;
# build.sh clones it and applies the two local-only link patches (rlib +
# `pub mod save`). No upstream writes.
crimson-rs = { path = "../../vendor/crimson-rs", default-features = false }
serde_json = "1"
sha2 = "0.10"
